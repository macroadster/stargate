name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Drop superseded runs on the same ref (matters most on busy `dev`).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  # Public modules (incl. github.com/macroadster/trin) via proxy; direct fallback.
  # Do not set GOPRIVATE for public deps — sumdb verification stays enabled.
  GOPROXY: https://proxy.golang.org,direct

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # //go:embed assets/frontend/* needs ≥1 file; EMBED_PLACEHOLDER is tracked for clean checkouts.
      - name: Run tests
        run: |
          test -f backend/assets/frontend/EMBED_PLACEHOLDER
          cd backend
          go test ./...

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test
        run: |
          cd frontend
          npm ci
          npm test -- --run

  # Full frontend embed + binary compile is the expensive job. Keep it on
  # main (push or PR); `dev` still gets unit tests above.
  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Prepare assets and build binary
        run: |
          mkdir -p backend/assets/frontend
          cp -r frontend/build/* backend/assets/frontend/
          cd backend
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA:-unknown}"
          COMMIT="${COMMIT:0:7}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-w -s -X main.version=${VERSION} -X main.gitCommit=${COMMIT}" \
            -o ../stargate .
          ./../stargate --version
          ./../stargate --help >/dev/null